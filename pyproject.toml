[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiusagetracker"
version = "0.4.1"
description = "Windows dashboard for Claude and Codex quotas, reset countdowns and alerts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SysAdminDoc", email = "matt_parker@outlook.com" }]
dependencies = [
    "httpx2==2.12.0",
    "customtkinter==6.0.0",
    "pystray==0.19.5",
    "pillow==12.3.0",
    "windows-toasts==1.3.1; platform_system=='Windows'",
]

[project.scripts]
aiusagetracker = "aiusagetracker.cli:main"

[project.gui-scripts]
aiusagetracker-gui = "aiusagetracker.gui.app:main"

[tool.setuptools.packages.find]
include = ["aiusagetracker*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
